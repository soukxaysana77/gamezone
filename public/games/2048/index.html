<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; height: 100%; background: #faf8ef; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; color: #776e65; }
  #board { display: grid; grid-template-columns: repeat(4, 80px); gap: 10px; background: #bbada0; padding: 10px; border-radius: 8px; }
  .t { width: 80px; height: 80px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 30px; background: #cdc1b4; }
  #top { display: flex; gap: 20px; align-items: center; margin-bottom: 12px; font-size: 20px; }
  button { font-size: 16px; padding: 6px 12px; border: 0; border-radius: 6px; background: #8f7a66; color: #fff; cursor: pointer; }
</style>
</head>
<body>
<div id="top"><span>คะแนน: <b id="score">0</b></span><button id="new">เริ่มใหม่</button></div>
<div id="board"></div>
<p id="msg"></p>
<script>
  const colors = { 2: '#eee4da', 4: '#ede0c8', 8: '#f2b179', 16: '#f59563', 32: '#f67c5f', 64: '#f65e3b', 128: '#edcf72', 256: '#edcc61', 512: '#edc850', 1024: '#edc53f', 2048: '#edc22e' };
  let g, score;
  const board = document.getElementById('board');

  function add() {
    const empty = [];
    g.forEach((v, i) => { if (!v) empty.push(i); });
    if (empty.length) g[empty[Math.floor(Math.random() * empty.length)]] = Math.random() < 0.9 ? 2 : 4;
  }
  function reset() { g = Array(16).fill(0); score = 0; add(); add(); render(); }
  function render() {
    board.innerHTML = g.map((v) => `<div class="t" style="background:${colors[v] || (v ? '#3c3a32' : '#cdc1b4')};color:${v > 4 ? '#fff' : '#776e65'};font-size:${v > 512 ? 22 : 30}px">${v || ''}</div>`).join('');
    document.getElementById('score').textContent = score;
    document.getElementById('msg').textContent = g.includes(2048) ? '🎉 ชนะแล้ว!' : canMove() ? '' : 'Game Over — กดเริ่มใหม่';
  }
  function slide(row) {
    const r = row.filter(Boolean);
    for (let i = 0; i < r.length - 1; i++) if (r[i] === r[i + 1]) { r[i] *= 2; score += r[i]; r.splice(i + 1, 1); }
    while (r.length < 4) r.push(0);
    return r;
  }
  function move(d) { // 0 left, 1 right, 2 up, 3 down
    const before = g.join();
    for (let i = 0; i < 4; i++) {
      const idx = [0, 1, 2, 3].map((j) => (d < 2 ? i * 4 + j : j * 4 + i));
      if (d === 1 || d === 3) idx.reverse();
      slide(idx.map((k) => g[k])).forEach((v, j) => (g[idx[j]] = v));
    }
    if (g.join() !== before) add();
    render();
  }
  function canMove() {
    if (g.includes(0)) return true;
    for (let i = 0; i < 16; i++) {
      if (i % 4 < 3 && g[i] === g[i + 1]) return true;
      if (i < 12 && g[i] === g[i + 4]) return true;
    }
    return false;
  }
  const map = { ArrowLeft: 0, ArrowRight: 1, ArrowUp: 2, ArrowDown: 3, a: 0, d: 1, w: 2, s: 3 };
  addEventListener('keydown', (e) => { if (e.key in map) { e.preventDefault(); move(map[e.key]); } });
  let tx, ty;
  addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; });
  addEventListener('touchend', (e) => {
    const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < 20) return;
    move(Math.abs(dx) > Math.abs(dy) ? (dx < 0 ? 0 : 1) : (dy < 0 ? 2 : 3));
  });
  document.getElementById('new').onclick = reset;
  reset();
</script>
</body>
</html>
